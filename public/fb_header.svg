<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 230" width="160" height="230">

  <g transform="translate(80, 16)">

    <!-- Handle -->
    <path d="M-50,48 Q0,-10 50,48" fill="none" stroke="#D4A030" stroke-width="7" stroke-linecap="round"/>
    <circle cx="-50" cy="48" r="5" fill="#A87820"/>
    <circle cx="50" cy="48" r="5" fill="#A87820"/>

    <!-- Bucket rim -->
    <rect x="-72" y="44" width="144" height="20" rx="5" fill="#E8B84B"/>
    <rect x="-72" y="44" width="144" height="20" rx="5" fill="none" stroke="#C9982A" stroke-width="1"/>

    <!-- Bucket body -->
    <polygon points="-66,64 66,64 54,178 -54,178" fill="#C9982A"/>
    <polygon points="-66,64 -42,64 -50,178 -54,178" fill="#A87820" opacity="0.5"/>
    <polygon points="-42,64 -20,64 -28,178 -50,178" fill="#E8B84B" opacity="0.15"/>

    <!-- Bucket bottom -->
    <rect x="-54" y="170" width="108" height="12" rx="3" fill="#A87820"/>

    <!-- fB on bucket face -->
    <text x="0" y="148" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#1a1a1a" opacity="0.25" text-anchor="middle">fB</text>
    <text x="0" y="148" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#7A5500" opacity="0.55" text-anchor="middle">fB</text>

    <!-- Film strip -->
    <rect x="-30" y="26" width="60" height="18" rx="2" fill="#111" stroke="#E8B84B" stroke-width="1.5"/>
    <rect x="-27" y="28" width="7" height="6" rx="1" fill="#333"/>
    <rect x="-17" y="28" width="7" height="6" rx="1" fill="#E8B84B" opacity="0.6"/>
    <rect x="-7" y="28" width="7" height="6" rx="1" fill="#333"/>
    <rect x="3" y="28" width="7" height="6" rx="1" fill="#888" opacity="0.5"/>
    <rect x="13" y="28" width="7" height="6" rx="1" fill="#333"/>
    <rect x="-27" y="36" width="7" height="6" rx="1" fill="#555"/>
    <rect x="-17" y="36" width="7" height="6" rx="1" fill="#555"/>
    <rect x="-7" y="36" width="7" height="6" rx="1" fill="#555"/>
    <rect x="3" y="36" width="7" height="6" rx="1" fill="#555"/>
    <rect x="13" y="36" width="7" height="6" rx="1" fill="#555"/>

    <!-- Reel clipped -->
    <clipPath id="rimclip">
      <rect x="-72" y="-20" width="144" height="84"/>
    </clipPath>

    <circle cx="0" cy="64" r="34" fill="#1a1a1a" stroke="#E8B84B" stroke-width="2.5" clip-path="url(#rimclip)"/>
    <line x1="0" y1="34" x2="0" y2="64" stroke="#E8B84B" stroke-width="2" clip-path="url(#rimclip)"/>
    <line x1="-20" y1="44" x2="20" y2="64" stroke="#E8B84B" stroke-width="2" clip-path="url(#rimclip)"/>
    <line x1="20" y1="44" x2="-20" y2="64" stroke="#E8B84B" stroke-width="2" clip-path="url(#rimclip)"/>
    <circle cx="0" cy="64" r="10" fill="#2a2a2a" stroke="#E8B84B" stroke-width="1.5" clip-path="url(#rimclip)"/>
    <circle cx="0" cy="64" r="4" fill="#111" clip-path="url(#rimclip)"/>
    <circle cx="0" cy="34" r="3.5" fill="#E8B84B" opacity="0.8" clip-path="url(#rimclip)"/>
    <circle cx="20" cy="44" r="3.5" fill="#E8B84B" opacity="0.8" clip-path="url(#rimclip)"/>
    <circle cx="-20" cy="44" r="3.5" fill="#E8B84B" opacity="0.8" clip-path="url(#rimclip)"/>
    <circle cx="0" cy="64" r="33" fill="none" stroke="#C9982A" stroke-width="1" opacity="0.6" clip-path="url(#rimclip)"/>

    <!-- FILMBUCKET text -->
    <text x="0" y="205" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle" letter-spacing="1.5">FILMBUCKET</text>
  </g>

</svg>
